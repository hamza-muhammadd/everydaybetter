<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>BetterEveryday Admin</title>
<style>
:root{--bg:#faf8f3;--ink:#232826;--mute:#5d6560;--green:#1f3d33;--line:#d9dcd3;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#161a18;--ink:#ece9e1;--mute:#a3aca6;--green:#8fb59f;--line:#2e3732;--card:#212825}}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}
.w{max-width:720px;margin:0 auto;padding:24px 18px 120px}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:15px;color:var(--green);margin:34px 0 10px;letter-spacing:.04em}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
input,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:92px;resize:vertical}
button{background:var(--green);color:#fff;border:0;border-radius:8px;padding:13px 24px;font:600 16px system-ui;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#10201a}}
button.ghost{background:none;color:var(--mute);border:1px solid var(--line);padding:8px 14px;font-size:14px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #a9b8a4;outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:720px;margin:0 auto;display:flex;gap:14px;align-items:center}
#msg{font-size:14px}.ok{color:#2e7d4f}.err{color:#c0392b}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hide{display:none}
</style>
</head>
<body>
<div class="w">

<div id="login" class="card" style="margin-top:40px">
<h1>Admin login</h1>
<p class="mute">Sign in with the user you created in Supabase.</p>
<label for="em">Email</label><input id="em" type="email" autocomplete="username">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<p id="lmsg" class="err"></p>
<button id="go" type="button">Log in</button>
</div>

<div id="editor" class="hide">
<div class="top"><div><h1>Edit your page</h1><p class="mute">Leave a field as it is to keep the current text.</p></div><button class="ghost" id="out" type="button">Log out</button></div>
<div id="form"></div>
<div class="bar"><div class="in"><button id="save" type="button">Save changes</button><span id="msg"></span><a class="mute" href="index.html" target="_blank" style="margin-left:auto">View page</a></div></div>
</div>

</div>
<script src="cms.js"></script>
<script>
(function(){
var token=null, defaults={}, saved={};
var $=function(id){return document.getElementById(id)};

$('go').onclick=function(){
  $('lmsg').textContent='';
  fetch(CMS.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:CMS.key,'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value.trim(),password:$('pw').value})})
  .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d}})})
  .then(function(x){
    if(!x.ok||!x.d.access_token){$('lmsg').textContent='Wrong email or password.';return}
    token=x.d.access_token;start();
  }).catch(function(){$('lmsg').textContent='Could not connect. Check your internet.'});
};
$('out').onclick=function(){token=null;location.reload()};

function start(){
  // read default text from the live page itself
  fetch('index.html').then(function(r){return r.text()}).then(function(h){
    var doc=new DOMParser().parseFromString(h,'text/html');
    CMS.fields.forEach(function(f){
      var el=doc.querySelector(f[2]);
      defaults[f[0]]=el?(f[3]==='link'?(el.getAttribute('href')||''):el.textContent.trim().replace(/\s+/g,' ')):'';
    });
  }).catch(function(){}).then(function(){return CMS.load()}).then(function(m){
    saved=m;render();
    $('login').classList.add('hide');$('editor').classList.remove('hide');
  });
}

function render(){
  var out='',last='';
  CMS.fields.forEach(function(f){
    if(f[4]!==last){out+='<h2>'+f[4].toUpperCase()+'</h2>';last=f[4]}
    var v=(saved[f[0]]!==undefined&&saved[f[0]]!=='')?saved[f[0]]:defaults[f[0]];
    if(f[3]==='link'&&v==='#')v='';
    v=String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
    out+='<label for="f_'+f[0]+'">'+f[1]+'</label>'+
      (f[3]==='long'?'<textarea id="f_'+f[0]+'">'+v+'</textarea>':'<input id="f_'+f[0]+'" type="'+(f[3]==='link'?'url':'text')+'" value="'+v+'"'+(f[3]==='link'?' placeholder="https://yourname.gumroad.com/l/..."':'')+'>');
  });
  $('form').innerHTML='<div class="card">'+out+'</div>';
}

$('save').onclick=function(){
  var rows=CMS.fields.map(function(f){return{key:f[0],value:$('f_'+f[0]).value.trim()}});
  var m=$('msg');m.className='';m.textContent='Saving…';
  fetch(CMS.url+'/rest/v1/site_content?on_conflict=key',{method:'POST',headers:Object.assign(CMS.headers(token),{Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(rows)})
  .then(function(r){
    if(r.ok){m.className='ok';m.textContent='Saved. Your page is updated.'}
    else if(r.status===401){m.className='err';m.textContent='Session expired. Log in again.'}
    else{m.className='err';m.textContent='Could not save. Check the SQL step.'}
  }).catch(function(){m.className='err';m.textContent='No connection.'});
};
})();
</script>
</body>
</html>
