<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Site editor</title>
<style>
:root{--bg:#f5f3ec;--pn:#fff;--ink:#1f2622;--mute:#68716b;--g:#1f3d33;--on:#fff;--sage:#a9b8a4;--line:#e2e4da;--bad:#b3392b;--ok:#2e7d4f;--sh:0 1px 2px rgba(20,41,31,.05),0 8px 24px rgba(20,41,31,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#121614;--pn:#1c2220;--ink:#ece9e1;--mute:#9aa49e;--g:#8fb59f;--on:#10201a;--line:#2b3430;--bad:#e8897c;--ok:#6fbf8d;--sh:0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.hide,[hidden]{display:none!important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lg{width:100%;max-width:400px;background:var(--pn);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:var(--sh)}
.lg .bd{margin-bottom:18px}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--pn);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
.bd{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.bd i{width:36px;height:36px;border-radius:10px;background:var(--g);color:var(--on);display:grid;place-items:center;flex:none}
#tabs{display:flex;flex-direction:column;gap:2px}
#tabs button{display:flex;gap:12px;align-items:center;padding:11px 12px;border:0;border-radius:10px;background:none;color:var(--ink);font:500 14.5px system-ui;text-align:left;cursor:pointer;transition:background .15s}
#tabs button:hover{background:var(--bg)}
#tabs button.on{background:var(--g);color:var(--on)}
.sf{margin-top:auto}
.main{width:100%;max-width:940px;padding:0 30px 80px}
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:18px 0 14px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.t1{display:flex;align-items:center;gap:10px}
#sitesel{flex:1;max-width:340px;font-weight:600}
.t1 .sp{flex:1}
.t2{margin-top:14px}
.t2 h1{margin:0;font-size:22px;letter-spacing:-.01em}
.t2 p{margin:2px 0 0;color:var(--mute);font-size:13.5px}
#dirty{font-size:13px;color:var(--bad);font-weight:600;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--g);color:var(--on);border:1px solid var(--g);border-radius:10px;padding:11px 20px;font:600 14.5px system-ui;cursor:pointer;text-decoration:none;white-space:nowrap;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gh{background:none;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:8px 12px;font-size:13.5px}
.btn.dg{background:none;color:var(--bad);border-color:var(--bad)}
input:not([type=checkbox]):not([type=color]):not([type=file]):not([type=range]),textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:92px;resize:vertical}
input[type=color]{width:56px;height:44px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;flex:none}
input[type=range]{width:100%;accent-color:var(--g)}
.card{background:var(--pn);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--sh);margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:16.5px}
.card .d{margin:0 0 6px;color:var(--mute);font-size:13.5px}
.fl{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin:16px 0 6px}
.rw{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mute);margin:8px 0 0}.hint.ok{color:var(--ok)}.hint.err{color:var(--bad)}
.f{margin-top:14px}
.f .fl{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px}
.rs{background:none;border:0;color:var(--mute);font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
.slot{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:start}
.pv,.pvs{height:120px;border:1px dashed var(--sage);border-radius:12px;display:grid;place-items:center;overflow:hidden;color:var(--mute);font-size:13px;background:repeating-conic-gradient(rgba(128,128,128,.12) 0 25%,transparent 0 50%) 0 0/16px 16px}
.pv img,.pvs img{max-width:100%;max-height:100%;object-fit:contain}
.imgf{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:start}.imgf .pvs{height:90px}
.sr{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.sr:last-child{border:0}
.sr .nm{flex:1;font-weight:500}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s}
.sw i:after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw input:checked+i{background:var(--g)}
.sw input:checked+i:after{transform:translateX(18px)}
.sep{margin:22px 0 8px;font-size:12.5px;font-weight:700;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.sorow{display:grid;grid-template-columns:160px minmax(0,1fr) auto;gap:10px;margin-top:10px}
.lc{border:1px solid var(--line);border-radius:14px;padding:6px 18px 18px;margin-top:14px;background:var(--bg)}
.lh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px}
.mv{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{background:none;border:1px dashed var(--g);color:var(--g);border-radius:99px;padding:7px 14px;font:600 13px system-ui;cursor:pointer}
.chip:hover{background:var(--g);color:var(--on)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
/* builder */
.bkrow{border:1px solid var(--line);border-radius:14px;background:var(--pn);margin-bottom:10px;box-shadow:var(--sh);transition:border-color .2s}
.bkrow[open]{border-color:var(--sage)}
.bkrow>summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none;flex-wrap:wrap}
.bkrow>summary::-webkit-details-marker{display:none}
.bi{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;color:var(--g)}
.bn{flex:1;font-weight:600;min-width:120px}
.tg{font-size:12px;color:var(--mute);background:var(--bg);border-radius:99px;padding:3px 10px;white-space:nowrap}
.bkb{padding:4px 18px 20px;border-top:1px solid var(--line)}
.sty{margin-top:18px;border:1px dashed var(--sage);border-radius:12px;padding:6px 16px 16px}
.sty>b{display:block;margin-top:12px;font-size:13px}
.rng{display:flex;gap:12px;align-items:center}.ro{min-width:44px;text-align:right;font-size:13px}
.colf{display:flex;gap:10px;align-items:center}
.adder{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:14px}
.at{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;color:var(--ink);font:inherit;transition:border-color .15s,transform .15s}
.at:hover{border-color:var(--g);transform:translateY(-2px)}
.at b{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--g)}.at span{font-size:12.5px;color:var(--mute);line-height:1.4}
.pals{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.pal{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;padding:0;background:none}
.pal:hover{border-color:var(--g)}.pal i{display:block;width:26px;height:44px}
.pvwrap{background:repeating-conic-gradient(rgba(128,128,128,.1) 0 25%,transparent 0 50%) 0 0/20px 20px;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;justify-content:center;overflow:auto}
.pvwrap iframe{height:72vh;border:0;background:#fff;border-radius:10px;box-shadow:var(--sh);transition:width .3s}
.mg{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px;background:var(--bg)}.mg p{margin:8px 0 0;white-space:pre-wrap}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--sh);z-index:50;max-width:92vw;text-align:center}
#toast.bad{background:var(--bad);color:#fff}
#toast a{color:inherit;text-decoration:underline;margin-left:8px}
@media(max-width:859px){
.app{display:block}
.side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;border-right:0;border-top:1px solid var(--line);overflow:visible}
.side>.bd,.sf{display:none}
#tabs{flex-direction:row;overflow-x:auto;width:100%;gap:2px}
#tabs button{flex-direction:column;gap:3px;font-size:11px;padding:7px 11px;white-space:nowrap}
.main{padding:0 14px 120px}
.top{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.t2 p{display:none}.t2{margin-top:10px}
#toast{bottom:92px}
}
@media(max-width:560px){.slot,.imgf{grid-template-columns:1fr}.sorow{grid-template-columns:minmax(0,1fr) auto}.sorow select{grid-column:1/-1}.btn.vw{display:none}.card{padding:18px}.g2{grid-template-columns:1fr}.t1{flex-wrap:wrap}#sitesel{max-width:none;flex:1 1 100%}.t1 .sp{display:none}.t1 #save{flex:1}.bkb{padding:4px 12px 16px}}
</style>
</head>

</div>

/* ---------- sites ---------- */
function afterSites(msg){return loadSites().then(function(){if(!sites.some(function(s){return s.slug===site}))site=sites[0].slug;return loadSite()}).then(function(){go('sites');if(msg)toast(msg)})}

 if(!slug){toast('Give the site a name first.',true);return}
 if(sites.some(function(s){return s.slug===slug})){toast('That id is already used. Choose another.',true);return}
 if(dirty&&!confirm('You have unsaved changes on the current site. Continue and lose them?'))return;
 rest('POST','sites',{slug:slug,name:name||slug,domains:dom}).then(function(r){return rj(r).then(function(j){if(!r.ok)throw new Error((j&&j.message)||r.status);
  if(!from)return;return CMS.get('site_content?select=key,value&site=eq.'+encodeURIComponent(from),token).then(function(rows){
   if(!Array.isArray(rows)||!rows.length)return;
   return rest('POST','site_content?on_conflict=site,key',rows.map(function(x){return{site:slug,key:x.key,value:x.value}}),'resolution=merge-duplicates,return=minimal')})})})
